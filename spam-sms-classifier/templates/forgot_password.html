<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your SpamGuard account password." />
    <title>Reset Password — SpamGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="auth-page">
    <div class="auth-card animate-fade">
      <div class="auth-logo">
        <span class="brand-mark">🛡️</span>
        <span class="brand-text">SPAMGUARD</span>
      </div>

      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Enter your mobile number or email to set a new password</p>

      <div class="auth-alert" id="auth-alert" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="identifier">Mobile Number or Email</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            class="form-input"
            placeholder="e.g. 9503564504 or you@example.com"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            class="form-input"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-input"
            placeholder="Repeat new password"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
          Update Password
        </button>
      </form>

      <hr class="auth-divider" />

      <p class="auth-footer">
        Remember your credentials?
        <a href="{{ url_for('login_page') }}" class="auth-link">Back to Sign In</a>
      </p>
      <p class="auth-footer" style="margin-top:8px">
        <a href="{{ url_for('home') }}" class="auth-link" style="color:var(--text-muted)">← Back to home</a>
      </p>
    </div>

    <script>
      const form  = document.getElementById('reset-form');
      const alert = document.getElementById('auth-alert');
      const btn   = document.getElementById('submit-btn');

      function showAlert(msg, type = 'error') {
        alert.textContent = msg;
        alert.className = 'auth-alert ' + type;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('identifier').value.trim();
        const password   = document.getElementById('new_password').value;
        const confirmPw  = document.getElementById('confirm_password').value;

        if (!identifier) {
          showAlert('Please enter your mobile number or email address.');
          return;
        }
        if (!password || password.length < 6) {
          showAlert('New password must be at least 6 characters.');
          return;
        }
        if (password !== confirmPw) {
          showAlert('Passwords do not match.');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Updating…';
        alert.className = 'auth-alert';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password, confirm_password: confirmPw })
          });
          const data = await res.json();

          if (!res.ok) {
            showAlert(data.error || 'Failed to reset password. Please verify your account details.');
            btn.disabled = false;
            btn.textContent = 'Update Password';
            return;
          }

          showAlert('Password updated successfully! Redirecting to sign in…', 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/login';
          }, 1200);
        } catch (err) {
          showAlert('Network error. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      });
    </script>
  </body>
</html>
