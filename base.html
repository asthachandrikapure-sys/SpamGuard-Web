<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detect spam messages using Machine Learning." />
    <title>{% block title %}Spam SMS Classifier{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-shell">
        <a href="{{ url_for('home') }}" class="brand" aria-label="Spam SMS Classifier home">
          <span class="brand-mark" aria-hidden="true">S/</span>
          <span class="brand-text">Spam SMS Classifier</span>
        </a>

        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
          {% set current = request.path %}
          <a href="{{ url_for('home') }}" class="nav-link {% if current == url_for('home') %}active{% endif %}">Home</a>
          <a href="{{ url_for('classifier_page') }}" class="nav-link {% if current == url_for('classifier_page') %}active{% endif %}">SMS Checker</a>
          <a href="{{ url_for('history_page') }}" class="nav-link {% if current == url_for('history_page') %}active{% endif %}">History</a>
          <a href="{{ url_for('about_page') }}" class="nav-link {% if current == url_for('about_page') %}active{% endif %}">About</a>
          <a href="{{ url_for('dashboard_page') }}" class="nav-link {% if current == url_for('dashboard_page') %}active{% endif %}">Dashboard</a>
        </nav>
      </div>
    </header>

    <main class="page-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-shell">
        <div>
          <div class="footer-brand">Spam SMS Classifier</div>
          <div class="footer-note">Detect spam messages using Machine Learning</div>
        </div>
        <div class="footer-copy">Python · Flask · Scikit-learn · MySQL</div>
      </div>
    </footer>

    <script>
      const navToggle = document.getElementById('nav-toggle');
      const mainNav = document.getElementById('main-nav');
      if (navToggle && mainNav) {
        navToggle.addEventListener('click', () => {
          const isOpen = mainNav.classList.toggle('open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
        });
      }
    </script>

    {% block scripts %}{% endblock %}
  </body>
</html>
